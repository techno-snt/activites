<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur réseau · Techno &amp; SNT Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="simulateur.css">
</head>
<body class="app">

<div class="notice" role="note">
  <p>Ce simulateur s'utilise sur un ordinateur, avec un écran d'au moins 800 px de large.</p>
  <p><a href="../">Retour aux outils</a></p>
</div>

<div class="app-shell">

  <header class="toolbar" aria-label="Barre d'outils">
    <button class="tb" id="btnNew" type="button" title="Nouveau plan" aria-label="Nouveau plan">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z M14 3v4h4"/></svg>
    </button>
    <label class="tb" title="Ouvrir un plan" aria-label="Ouvrir un plan">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z M3 11h18"/></svg>
      <input type="file" id="fileImport" accept=".json,.fls,application/json">
    </label>
    <button class="tb" id="btnExport" type="button" title="Enregistrer le plan" aria-label="Enregistrer le plan">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z M8 3v5h7V3 M8 21v-7h8v7"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb" id="btnScenario" type="button" title="Charger le scénario de la séance" aria-label="Charger le scénario de la séance">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4 M5 4h12l-2 4 2 4H5"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb" id="btnConcept" type="button" aria-pressed="true" title="Mode conception : construire et câbler le plan" aria-label="Mode conception"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z M14 6l3 3"/></svg></button>
    <button class="tb" id="btnSim" type="button" aria-pressed="false" title="Mode simulation : plan verrouillé pendant les tests" aria-label="Mode simulation"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb" type="button" data-mode="select" aria-pressed="true" title="Déplacer et configurer" aria-label="Déplacer et configurer">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"/></svg>
    </button>
    <button class="tb" type="button" data-mode="delete" aria-pressed="false" title="Supprimer un appareil ou un câble" aria-label="Supprimer un appareil ou un câble">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 14h10l1-14"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb" id="btnZoomOut" type="button" title="Zoom arrière" aria-label="Zoom arrière">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5 M8 11h6"/></svg>
    </button>
    <button class="tb" id="btnZoomIn" type="button" title="Zoom avant" aria-label="Zoom avant">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5 M8 11h6 M11 8v6"/></svg>
    </button>
    <label class="speed-ctl" title="Vitesse de l'animation des paquets" aria-label="Vitesse de l'animation des paquets">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14l4-4 M4 16a8 8 0 1116 0"/></svg>
      <input type="range" id="animSpeed" min="1" max="5" step="1" value="3">
    </label>
    <button class="tb" id="btnStep" type="button" aria-pressed="false" hidden title="Pas-à-pas : chaque segment du paquet attend votre clic" aria-label="Pas-à-pas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7z M18 5v14"/></svg></button>
    <span class="spacer" aria-hidden="true"></span>
    <button class="tb" id="btnTerm" type="button" aria-pressed="false" title="Afficher ou masquer le terminal" aria-label="Afficher ou masquer le terminal">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3z M7 9l3 3-3 3 M12 15h5"/></svg>
    </button>
  </header>

  <aside class="palette" aria-label="Appareils et câbles">
    <button type="button" class="pal-single" data-mode="cable" aria-pressed="false" title="Câbler : cliquer un port, puis un port de l'autre appareil" aria-label="Câble"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Câble</span></button>
    <section class="pal-group" aria-label="Terminaux">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Terminaux"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Terminaux</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Terminaux">
      <button type="button" data-add="pc" draggable="true" title="Ordinateur (il peut aussi être serveur : web, DNS, DHCP sur son bureau)" aria-label="Ordinateur"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Ordinateur</span></button>
      <button type="button" data-add="notebook" draggable="true" title="Portable" aria-label="Portable"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Portable</span></button>
      <button type="button" data-add="smartphone" draggable="true" title="Smartphone" aria-label="Smartphone"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Smartphone</span></button>
      <button type="button" data-add="tablet" draggable="true" title="Tablette" aria-label="Tablette"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Tablette</span></button>
      <button type="button" data-add="printer" draggable="true" title="Imprimante" aria-label="Imprimante"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Imprimante</span></button>
      <button type="button" data-add="tv" draggable="true" title="Smart TV" aria-label="Smart TV"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Smart TV</span></button>
      <button type="button" data-add="iot" draggable="true" title="Objet connecté" aria-label="Objet connecté"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Objet connecté</span></button>
      </div>
    </section>
    <section class="pal-group" aria-label="Commutation">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Commutation"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Commutation</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Commutation">
      <button type="button" data-add="switch" draggable="true" title="Switch" aria-label="Switch"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Switch</span></button>
      </div>
    </section>
    <section class="pal-group" aria-label="Routage">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Routage"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Routage</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Routage">
      <button type="button" data-add="router" draggable="true" title="Routeur" aria-label="Routeur"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Routeur</span></button>
      <button type="button" data-add="wifi" draggable="true" title="Routeur Wi-Fi" aria-label="Routeur Wi-Fi"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Routeur Wi-Fi</span></button>
      <button type="button" data-add="box" draggable="true" title="Box internet" aria-label="Box internet"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Box internet</span></button>
      </div>
    </section>
    <section class="pal-group" aria-label="Serveur">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Serveur"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Serveur</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Serveur">
      <button type="button" data-add="server" draggable="true" title="Serveur" aria-label="Serveur"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Serveur</span></button>
      </div>
    </section>
    <section class="pal-group" aria-label="Nœuds virtuels">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Nœuds virtuels"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Nœuds virtuels</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Nœuds virtuels">
      <button type="button" data-add="operator" draggable="true" title="Opérateur internet" aria-label="Opérateur internet"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Opérateur internet</span></button>
      <button type="button" data-add="datacenter" draggable="true" title="Datacenter" aria-label="Datacenter"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Datacenter</span></button>
      </div>
    </section>
    <section class="pal-group" aria-label="Blocs">
      <button type="button" class="pal-cat" aria-haspopup="true" aria-expanded="false" aria-label="Blocs"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Blocs</span></button>
      <div class="pal-fly" role="group" aria-label="Appareils : Blocs">
      <button type="button" data-add="block" draggable="true" title="Bloc : regrouper des appareils (salle, réseau)" aria-label="Bloc"><svg class="ic" viewBox="-40 -40 80 80" aria-hidden="true"></svg><span class="cap">Bloc</span></button>
      </div>
    </section>
  </aside>

  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <button type="button" class="plan-badge" id="modeBadge" title="Cliquer pour passer en mode conception ou simulation">
        <svg class="mi mi-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>
        <svg class="mi mi-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>
        <span id="modeText">Mode conception</span>
      </button>
      <p class="plan-hint" id="planHint"></p>
      <div class="legend" id="legend" aria-label="Légende des couleurs"></div>
      <section class="desk-zone" id="deskZone" aria-label="Bureaux des ordinateurs (simulation)" hidden></section>
      <svg id="canvas" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Plan du réseau">
        <defs>
          <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#e9eef7"/>
          </linearGradient>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f1b3d" flood-opacity=".22"/>
          </filter>
        </defs>
        <rect x="-3000" y="-3000" width="7000" height="7000" fill="transparent" class="bg"/>
        <g id="layerBlocks"></g>
        <g id="layerLinks"></g>
        <g id="layerNodes"></g>
        <g id="layerPk"></g>
        <g id="layerHandles"></g>
      </svg>
    </div>

    <section class="term" id="term" aria-label="Terminal">
      <div class="term-top">
        <label for="termHost">Machine</label>
        <select id="termHost"></select>
      </div>
      <pre id="termOut" tabindex="0" aria-label="Sortie du terminal"></pre>
      <form id="termForm" class="term-form">
        <label for="cmd">Commande</label>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="ping 192.168.0.10">
        <button type="submit">Lancer</button>
      </form>
    </section>
  </main>

  <aside class="props" aria-label="Configuration de l'appareil sélectionné">
    <h2>Configuration</h2>
    <div id="props"></div>
  </aside>

  <footer class="statusbar">
    <p id="status" role="status" aria-live="polite"></p>
    <div class="stepbar" id="stepBar" hidden role="group" aria-label="Pas-à-pas">
      <span id="stepText"></span>
      <button type="button" id="stepNext">Suivant</button>
      <button type="button" id="stepPlay">Lecture continue</button>
    </div>
    <span class="build" id="buildId" title="Numéro du commit de cette version"></span>
  </footer>

</div>

<script src="build.js"></script>
<script>document.getElementById('buildId').textContent = window.SIM_BUILD || '';</script>
<script src="filius.js"></script>
<script src="simulateur.js"></script>
</body>
</html>
