<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulation de réseau — étapes guidées (simulateur)</title>
<style>
  :root { --fg:#1d2330; --muted:#5b6475; --line:#d7dce5; --bg:#f6f7f9; --ok:#1f7a3d; --ko:#b3261e; --acc:#1f4e8c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:#fff; line-height:1.45; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  h1 { font-size:1.05rem; margin:0; }
  .steps, .hbtn { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:5px 10px; border-radius:999px; border:1px solid #aab2c0; background:#fff; color:var(--fg); font-size:.85rem; cursor:pointer; }
  .chip.cur { background:var(--acc); color:#fff; border-color:var(--acc); }
  .chip.ok::before { content:"✔ "; color:var(--ok); }
  .chip.cur.ok::before { color:#fff; }
  button { padding:6px 10px; border:0; border-radius:5px; background:var(--acc); color:#fff; font:inherit; font-size:.9rem; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.sec { background:#e7ebf2; color:var(--fg); }
  main { display:flex; flex-direction:column; gap:10px; padding:10px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff; min-height:0; }
  .card h2 { font-size:.95rem; margin:0 0 6px; color:var(--acc); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card h2 button { font-size:.8rem; padding:4px 8px; }
  .steps-card { overflow:auto; font-size:.92rem; }
  .steps-card #stepBody p { margin:4px 0; }
  .steps-card .checks li { font-size:.9rem; margin:4px 0; }
  .sim-card { display:flex; flex-direction:column; }
  iframe.sim { width:100%; flex:1; min-height:480px; height:70vh; border:1px solid var(--line); border-radius:6px; background:#fbfcfd; }
  /* Grand écran : étapes à gauche, simulateur qui occupe toute la hauteur disponible */
  @media (min-width:1000px) {
    main { display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); height:calc(100vh - 58px); padding:8px; gap:10px; }
    .steps-card { height:100%; }
    .sim-card { height:100%; }
    iframe.sim { height:auto; min-height:0; }
  }
  /* Petits écrans (ordinateurs élèves) : le simulateur reste le plus grand possible */
  @media (max-width:999px) {
    header { padding:6px 10px; }
    h1 { font-size:.95rem; }
    .chip { font-size:.78rem; padding:4px 8px; }
  }
  .legend { font-size:.82rem; color:var(--muted); margin-top:6px; }
  .plan li { margin:4px 0; }
  .checks ul { list-style:none; padding:0; margin:8px 0 0; }
  .checks li { display:flex; gap:8px; align-items:flex-start; font-size:.95rem; margin:6px 0; }
  .st { flex:none; font-weight:700; width:1.2em; text-align:center; }
  .st.ok { color:var(--ok); } .st.ko { color:var(--ko); } .st.wait { color:var(--muted); }
  .simerr { color:var(--ko); font-size:.9rem; margin-top:6px; }
  table.m { width:100%; border-collapse:collapse; font-size:.9rem; margin-top:6px; }
  table.m th, table.m td { border:1px solid var(--line); padding:5px; text-align:left; vertical-align:middle; }
  .recap { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; list-style:none; padding:0; }
  .recap li { border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:6px; padding:10px 12px; background:#fbfcfe; }
  .recap li b { display:block; color:var(--acc); margin-bottom:3px; }
  /* Bilan : pleine largeur, sans simulateur */
  body.bilan main { display:block; height:auto; padding:16px 22px; }
  body.bilan .sim-card { display:none; }
  body.bilan .steps-card { height:auto; overflow:visible; font-size:1rem; }
  body.bilan .recap { grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  body.bilan .recap li { padding:16px 18px; font-size:1.02rem; }
</style>
</head>
<body>
<header>
  <h1>Simulation de réseau — étapes guidées</h1>
  <div class="steps" id="stepBar"></div>
  <div class="hbtn">
    <button class="sec" id="bPrev" onclick="go(-1)">◀ Précédent</button>
    <button id="bNext" onclick="go(1)">Suivant ▶</button>
  </div>
</header>

<main>
  <div class="card steps-card">
    <div id="stepNo" style="font-size:.85rem;color:var(--muted)"></div>
    <h2 id="stepTitle" style="font-size:1.05rem;margin:0 0 6px;display:block"></h2>
    <div id="stepBody"></div>
  </div>

  <div class="card sim-card">
    <h2>Simulateur réseau <button class="sec" onclick="fullSim()">Agrandir</button></h2>
    <iframe class="sim" id="sim" src="https://techno-snt.github.io/activites/outils/simulateur-reseau/?scenario=seance" title="Simulateur réseau" allow="fullscreen"></iframe>
    <div class="legend">Si le cadre reste vide, <a href="https://techno-snt.github.io/activites/outils/simulateur-reseau/?scenario=seance" target="_blank" rel="noopener">ouvrir le simulateur dans un nouvel onglet</a> (dans ce cas la vérification automatique ne fonctionne pas).</div>
  </div>
</main>

<script>
const SITE = 'www.monsite-snt.fr';

// Tableau des pings (étape 2) : la bonne réponse n'est pas dans la page, elle est lue dans le simulateur
const ROWS = [
  { k:'a', src:'NB', dst:'192.168.0.11',  from:'Portable',   to:'Ordinateur 192.168.0.11' },
  { k:'b', src:'PC', dst:'192.168.0.10',  from:'Ordinateur', to:'Portable 192.168.0.10' },
  { k:'c', src:'PC', dst:'192.168.140.1', from:'Ordinateur', to:'192.168.140.1' },
  { k:'d', src:'PC', dst:'192.168.21.1',  from:'Ordinateur', to:'192.168.21.1' },
  { k:'e', src:'NB', dst:'192.168.140.1', from:'Portable',   to:'192.168.140.1' },
  { k:'f', src:'NB', dst:'192.168.21.1',  from:'Portable',   to:'192.168.21.1' }
];
const answers = {};    // réponses de l'élève au tableau
const selfDone = {};   // cases à cocher non vérifiables par la page

// Nombre de paquets reçus lors du dernier ping vers dst lancé depuis host (null si jamais lancé)
function lastStats(out, host, dst) {
  const L = out[host] || [];
  let idx = -1;
  for (let i = 0; i < L.length; i++) if (L[i].indexOf('Statistiques Ping pour ' + dst + ':') === 0) idx = i;
  if (idx < 0) return null;
  for (let j = idx + 1; j < L.length && j <= idx + 4; j++) {
    const m = /reçus = (\d+)/.exec(L[j]);
    if (m) return +m[1];
  }
  return null;
}
// État du simulateur (même site : lecture possible), ou null si le cadre ne répond pas
function sim() {
  try {
    const f = document.getElementById('sim');
    return f.contentWindow && f.contentWindow.simState ? f.contentWindow.simState() : null;
  } catch (e) { return null; }
}

const STEPS = [
  { t:'Un réseau local',
    html:`<p><b>1. Réglez les adresses.</b> En mode conception, cliquez sur l'Ordinateur dans le plan, puis réglez son adresse dans le panneau <b>Configuration</b> : <b>192.168.0.11</b> (masque 255.255.255.0). Faites de même pour le Portable : <b>192.168.0.10</b>.</p>
    <p><b>2. Passez en mode simulation.</b> Cliquez sur <b>▶ Mode simulation</b>, au-dessus du plan. Le plan se verrouille : c'est dans ce mode que l'on lance les pings. Pour modifier une adresse, revenez en mode conception.</p>
    <p><b>3.</b> Sur le Portable, ouvrez la <b>Ligne de commande</b> (icône sur le bureau du Portable) et tapez <code>ping 192.168.0.11</code>.</p>`,
    checks:[
      { l:"Adresse IP de l'Ordinateur : 192.168.0.11", t:s => s.nodes.PC && s.nodes.PC.ip === '192.168.0.11' },
      { l:"Adresse IP du Portable : 192.168.0.10", t:s => s.nodes.NB && s.nodes.NB.ip === '192.168.0.10' },
      { l:"Mode simulation activé", t:s => s.sim === true },
      { l:"Ping du Portable vers 192.168.0.11 réussi", t:s => (lastStats(s.out, 'NB', '192.168.0.11') || 0) > 0 }
    ] },
  { t:'Sortir du réseau local',
    html:`<p>Restez en <b>mode simulation</b>. Lancez chaque ping depuis la machine indiquée dans sa <b>Ligne de commande</b> (icône sur le bureau), puis notez si la réponse est <b>réussie ou non</b>. Pour cette question, augmentez la vitesse des paquets (curseur au-dessus du plan).</p>
    <table class="m">
      <tr><th>Depuis</th><th>Vers</th><th>Résultat</th></tr>
      ${ROWS.map(r => `<tr><td>${r.from}</td><td>${r.to}</td><td>
        <label><input type="radio" name="r-${r.k}" onchange="setAns('${r.k}','ok')" ${answers[r.k] === 'ok' ? 'checked' : ''}> Réussi</label>
        &nbsp; <label><input type="radio" name="r-${r.k}" onchange="setAns('${r.k}','ko')" ${answers[r.k] === 'ko' ? 'checked' : ''}> Échec</label>
      </td></tr>`).join('')}
    </table>`,
    checks: ROWS.map(r => ({
      l:`${r.from} → ${r.to} : ping lancé et réponse correctement indiquée`,
      t:s => { const rec = lastStats(s.out, r.src, r.dst); return rec !== null && ((rec > 0) === (answers[r.k] === 'ok')); }
    })) },
  { t:'La passerelle',
    html:`<p>Le Portable fonctionne déjà vers l'extérieur. En mode conception, cliquez sur le Portable et relevez sa <b>passerelle</b> dans le panneau Configuration. Reportez cette adresse comme passerelle de l'<b>Ordinateur</b>, puis revenez en <b>mode simulation</b>.</p>
    <p>Sur l'Ordinateur, ouvrez la <b>Ligne de commande</b> et tapez <code>ping 192.168.140.1</code>. Observez le trajet du paquet sur le plan.</p>`,
    checks:[
      { l:"Passerelle du Portable reportée sur l'Ordinateur", t:s => !!s.nodes.PC && !!s.nodes.NB && s.nodes.PC.gw !== '' && s.nodes.PC.gw === s.nodes.NB.gw },
      { l:"Ping de l'Ordinateur vers 192.168.140.1 réussi", t:s => (lastStats(s.out, 'PC', '192.168.140.1') || 0) > 0 }
    ] },
  { t:'Le site et le serveur DNS',
    html:`<p>Le serveur DNS et le serveur Web sont des <b>serveurs</b> (palette « Serveur »), déjà en place.</p>
    <p><b>1. Installez le navigateur sur le Portable.</b> Cliquez sur le Portable dans le plan : son bureau s'affiche. Ouvrez <b>Installation des logiciels</b>, sélectionnez le <b>Navigateur web</b> et installez-le.</p>
    <p><b>2.</b> Ouvrez le <b>Navigateur web</b> du Portable et tapez <code>192.168.21.1</code> : la page du site s'affiche.</p>
    <p><b>3.</b> Tapez ensuite <code>${SITE}</code> : cela ne marche pas. Le serveur DNS de l'opérateur est <b>192.168.140.1</b> : réglez-le sur les deux machines (panneau Configuration, en mode conception). Revenez en mode simulation, retapez le nom dans le navigateur, puis lancez <code>ping ${SITE}</code> dans la Ligne de commande.</p>`,
    checks:[
      { l:"Navigateur web installé sur le Portable", t:s => !!s.nodes.NB && s.nodes.NB.sw.indexOf('nav') >= 0 },
      { l:"Serveur DNS 192.168.140.1 réglé sur les deux machines", t:s => !!s.nodes.PC && !!s.nodes.NB && s.nodes.PC.dns === '192.168.140.1' && s.nodes.NB.dns === '192.168.140.1' },
      { l:`Ping de ${SITE} réussi (par le nom)`, t:s => ['PC', 'NB'].some(h => (s.out[h] || []).some(x => x.indexOf('sur ' + SITE + ' [') >= 0) && (lastStats(s.out, h, '192.168.21.1') || 0) > 0) },
      { l:"Page du site affichée dans le navigateur (vérifié par vous)", self:true }
    ] },
  { t:'Bilan', recap:true,
    html:`<ul class="recap">
      <li><b>Adresse IP</b> identifie chaque machine ; les trois premiers nombres désignent le réseau.</li>
      <li><b>Switch</b> relie les machines d'un même réseau : elles se parlent directement.</li>
      <li><b>Passerelle</b> fait sortir un paquet vers un autre réseau. Une machine ne l'utilise que hors de son réseau.</li>
      <li><b>Box et NAT</b> remplacent l'adresse de départ par celle de la box, et retiennent qui a envoyé quoi pour que la réponse revienne.</li>
      <li><b>Serveur DNS</b> traduit un nom (${SITE}) en adresse IP avant toute connexion.</li>
      <li><b>Ping</b> envoie une demande et attend la réponse : il teste le chemin aller et le chemin retour.</li>
    </ul>
    <p class="legend">Chemin d'une visite de site : Portable → serveur DNS (nom → adresse IP) → box → opérateur → serveur web (page affichée).</p>` }
];

let step = 0;

function stepOK(i) {
  const s = sim(), st = STEPS[i];
  if (!st.checks) return true;
  return st.checks.every((c, j) => c.self ? !!selfDone[i + '-' + j] : (!!s && !!c.t(s)));
}
function setAns(k, v) { answers[k] = v; updateChecks(); }
function setSelf(i, j, v) { selfDone[i + '-' + j] = v; updateChecks(); }

function checksHTML() {
  const st = STEPS[step];
  if (!st.checks) return '';
  const s = sim();
  const items = st.checks.map((c, j) => {
    if (c.self) return `<li><span class="st ${selfDone[step + '-' + j] ? 'ok' : 'wait'}">${selfDone[step + '-' + j] ? '✔' : '○'}</span><label><input type="checkbox" ${selfDone[step + '-' + j] ? 'checked' : ''} onchange="setSelf(${step},${j},this.checked)"> ${c.l}</label></li>`;
    const ok = !!s && !!c.t(s);
    const cls = !s ? 'wait' : ok ? 'ok' : 'ko';
    return `<li><span class="st ${cls}">${!s ? '○' : ok ? '✔' : '✖'}</span><span>${c.l}</span></li>`;
  }).join('');
  const err = s ? '' : '<div class="simerr">Le simulateur ne répond pas : vérifiez qu\'il est bien affiché ci-dessous. La vérification automatique ne fonctionne pas si le simulateur est ouvert dans un autre onglet.</div>';
  return `<div class="checks" style="margin-top:10px"><b>Vérification de cette étape :</b><ul>${items}</ul>${err}</div>`;
}

function render() {
  const st = STEPS[step];
  document.body.classList.toggle('bilan', !!st.recap);
  document.getElementById('stepNo').textContent = `Étape ${step + 1} sur ${STEPS.length}`;
  document.getElementById('stepTitle').textContent = st.t;
  document.getElementById('stepBody').innerHTML = st.html + '<div id="chk">' + checksHTML() + '</div>';
  updateChecks();
}

// Mise à jour périodique : bascule des états, boutons et pastilles, sans reconstruire les réponses saisies
function updateChecks() {
  const chk = document.getElementById('chk');
  if (chk && STEPS[step].checks) chk.innerHTML = checksHTML();
  const f = STEPS.map((_, i) => stepOK(i));
  document.getElementById('stepBar').innerHTML = STEPS.map((x, i) => {
    const canGo = i <= step || f.slice(0, i).every(Boolean);
    return `<button class="chip ${i === step ? 'cur' : ''} ${f[i] ? 'ok' : ''}" ${canGo ? '' : 'disabled'} onclick="setStep(${i})">${i + 1}. ${x.t}</button>`;
  }).join('');
  document.getElementById('bPrev').disabled = step === 0;
  document.getElementById('bNext').disabled = step >= STEPS.length - 1 || !f[step];
}
function setStep(i) {
  if (i > step && !stepOK(step)) return;
  step = i; render(); window.scrollTo({ top:0, behavior:'smooth' });
}
function go(d) { setStep(step + d); }
function fullSim() { const f = document.getElementById('sim'); if (f.requestFullscreen) f.requestFullscreen(); }

render();
setInterval(updateChecks, 1000);
</script>
</body>
</html>
